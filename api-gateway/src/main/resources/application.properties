#Application name
spring.application.name= api-gateway

#Reactive Web Application
spring.main.web-application-type=reactive

#Client registration options :
eureka.client.service-url.defaultZone = http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=NGUYENHUYNHTHUHIEN

#Spring Cloud Gateway Configuration
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[1].id=product-catalog-service
spring.cloud.gateway.routes[1].uri=lb://product-catalog-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shop/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[3].id=product-recommendation-service
spring.cloud.gateway.routes[3].uri=lb://product-recommendation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/review/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[4].id=product-catalog-service-admin-posts
spring.cloud.gateway.routes[4].uri=lb://product-catalog-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/posts/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[5].id=product-catalog-service-admin-banners
spring.cloud.gateway.routes[5].uri=lb://product-catalog-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/admin/banners/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=product-catalog-service-admin-posts
spring.cloud.gateway.routes[4].uri=lb://product-catalog-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/posts/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[5].id=product-catalog-service-admin-banners
spring.cloud.gateway.routes[5].uri=lb://product-catalog-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/admin/banners/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=2



spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#SPRING SESSION & REDIS PROPERTIES :
#-------------------------------
spring.session.store-type=redis
spring.session.redis.namespace=session
spring.session.redis.flush-mode=on-save
spring.redis.host=localhost
spring.redis.port=6379

